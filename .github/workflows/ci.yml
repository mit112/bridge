name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# One in-flight run per ref; cancel superseded runs to keep the required
# check fast and unambiguous.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: macos-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      # A real DOM-adjacent slice of the JS test lane (test_morph.py,
      # test_static_js.py, test_swap_lifecycle.py, test_liverefresh.py,
      # test_shell_contract.py) shells out to `node` and self-skips when it
      # is absent -- a skip that is silent, not a failure. `macos-latest`
      # happens to ship Node today, so this lane has only ever run by
      # accident of the runner image, never because CI guaranteed it. Pin it
      # explicitly so a future runner-image change can't quietly turn ~350
      # tests into no-ops with a green checkmark.
      - name: Install Node (required by the JS test lane)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync dependencies (with dev extras)
        run: uv sync --extra dev

      - name: Run the test suite under a clean HOME (hermetic)
        env:
          # The suite must pass with no real ~/.bridge or ~/.claude corpus
          # present (docs/ARCHITECTURE.md). Point HOME at a throwaway dir so
          # CI actually exercises hermeticity instead of trusting the runner.
          HOME: ${{ runner.temp }}/clean-home
        run: |
          mkdir -p "$HOME"
          uv run pytest

  # Reports (does not gate — see note below) whether the tap formula's resource
  # block still matches what tools/brew_resources.py generates from uv.lock.
  # NOT a required check: it checks out the tap repo, so gating main PRs on it
  # would couple them to tap availability. Only `test` is required.
  brew-resources-drift:
    name: brew-resources-drift
    runs-on: macos-latest
    steps:
      - name: Check out the main repo
        uses: actions/checkout@v4
      - name: Check out the tap
        uses: actions/checkout@v4
        with:
          repository: mit112/homebrew-bridge
          path: _tap
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Regenerate resources from uv.lock
        run: uv run python tools/brew_resources.py uv.lock > _generated_resources.rb
      - name: Extract committed resource block from the tap
        run: |
          awk '/# BEGIN GENERATED RESOURCES/{f=1;next} /# END GENERATED RESOURCES/{f=0} f' \
            _tap/Formula/bridge.rb \
            | sed '/^[[:space:]]*#/d' \
            | sed '/^[[:space:]]*$/d' > _committed_resources.rb
      - name: Fail on drift
        run: |
          sed '/^[[:space:]]*$/d' _generated_resources.rb > _gen_clean.rb
          if ! diff -u _committed_resources.rb _gen_clean.rb; then
            echo "::error::Formula resources drifted from uv.lock. Run tools/brew_resources.py and re-splice into the tap." >&2
            exit 1
          fi
          echo "Resources match uv.lock."
