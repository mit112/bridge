[project]
name = "bridge"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["fastapi", "uvicorn[standard]", "jinja2"]

[project.scripts]
bridge = "bridge.cli:main"

[project.optional-dependencies]
dev = [
    "httpx2>=2.9.1",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
