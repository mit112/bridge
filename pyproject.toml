[project]
name = "bridge"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["fastapi", "uvicorn[standard]", "jinja2"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
