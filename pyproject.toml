[project]
name = "bridge"
version = "0.1.0"
description = "A local control panel for Claude Code projects — see each project's state, keep the next-session prompt with it, and launch the session from the card."
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Mit Sheth" }]
urls = { repository = "https://github.com/mit112/bridge", issues = "https://github.com/mit112/bridge/issues", documentation = "https://github.com/mit112/bridge/blob/main/docs/ARCHITECTURE.md" }
license = { text = "MIT" }
keywords = ["claude-code", "claude", "developer-tools", "productivity"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Utilities",
]
dependencies = ["fastapi", "uvicorn[standard]", "jinja2"]

[project.scripts]
bridge = "bridge.cli:main"

[project.optional-dependencies]
dev = [
    "httpx2>=2.9.1",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bridge"]
force-include = { "commands/handoff.md" = "bridge/commands/handoff.md" }

[tool.hatch.build.targets.sdist]
# No `include` key: hatchling treats it as a REPLACEMENT for the default file
# selection, not an addition, so listing `commands/handoff.md` alone shipped an
# sdist with no `src/bridge` in it at all -- and since `uv build` and
# `python -m build` build the wheel FROM the sdist, the wheel was empty too.
# The default (everything tracked, minus `.gitignore`) is what we want.
only-include = ["src", "commands", "tests", "tools", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
